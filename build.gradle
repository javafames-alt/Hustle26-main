plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { mavenCentral() }
loom {
    splitEnvironmentSourceSets()
    mods {
        hustle263 {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
dependencies {
    include implementation('io.netty:netty-handler-proxy:4.2.16.Final')
    include implementation('io.netty:netty-codec-socks:4.2.16.Final')
    implementation "net.fabricmc:fabric-language-kotlin:${fabric_kotlin_version}"
    implementation files('src/main/resources/META-INF/jars/punchy-2.8e-fabric-26.3.jar')
    implementation files('src/main/resources/META-INF/jars/ViaFabricPlus-5.1.2.jar',
        'src/main/resources/META-INF/jars/IAS-9.0.8+26.3-fabric.jar')
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
processResources {
    exclude '**/__pycache__/**'
    includeEmptyDirs = false
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25
    }
}
sourceSets {
    client { kotlin.srcDir 'src/client/kotlin' }
}

// Tests cover module registration, lifecycle, filtering and persisted state.
dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
}
sourceSets.test.compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
tasks.named('test') {
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    // Run this suite in a normal JVM: the isolated worker fails to load these client tests.
    exclude 'im/yaHustler/config/ClientConfigProfileTest*.class'
    exclude 'im/yaHustler/config/ProfileTestRunner.class'
    exclude 'im/yaHustler/ui/GuiTransformTest.class'
    exclude 'im/yaHustler/ui/GuiMotionTest.class'
    exclude 'im/yaHustler/ui/EventsFeedTest.class'
    exclude 'im/yaHustler/ui/WeatherGeometrics.class'
    exclude 'im/yaHustler/ui/HandFlameImageCheck.class'
    exclude 'im/yaHustler/ui/BackdropImageCheck.class'
    exclude 'im/yaHustler/ui/BackdropRegionTest.class'
    exclude 'im/yaHustler/command/ClientCommandsTest*.class'
    exclude 'im/yaHustler/ui/GuiTextImageCheck.class'
    exclude 'im/yaHustler/ui/PumpkinImageCheck.class'
    exclude 'im/yaHustler/performance/OptimizationTest*.class'
    exclude 'im/yaHustler/combat/AuraRotation.class'
    exclude 'im/yaHustler/combat/CrystalProfileTest.class'
    exclude 'im/yaHustler/combat/SilentRotationTest.class'
    exclude 'im/yaHustler/ui/Interface.class'
    exclude 'im/yaHustler/ui/HustleFeaturesTest.class'
    exclude 'im/yaHustler/ui/NewModulesTest.class'
    exclude 'im/yaHustler/ui/CosmeticsInteractionTest.class'
    exclude 'im/yaHustler/ui/NoSlowCheck.class'
    exclude 'im/yaHustler/ui/WebPush.class'
    exclude 'im/yaHustler/ui/ElytraBoosterCheck.class'
    exclude 'im/yaHustler/ui/GrimGlideCheck.class'
    exclude 'im/yaHustler/ui/TextOverflowTest.class'
    exclude 'im/yaHustler/ui/CameraMotionHistoryTest.class'
    exclude 'im/yaHustler/ui/Visual*.class'
    exclude 'im/yaHustler/ui/CustomCrystalTest.class'
    exclude 'im/yaHustler/hud/LyricsLayoutTest*.class'
    exclude 'im/yaHustler/render/music/Music3DSceneTest.class'
}
tasks.register('verifyProfiles', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'im.yaHustler.config.ProfileTestRunner'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.named('check') { dependsOn tasks.named('verifyProfiles') }

